{% extends 'base.html' %}

{% block content %}

<section class="py-20">

    <div class="container mx-auto px-6 max-w-5xl">

        <h1 class="text-5xl font-bold mb-6">
            {{ attraction.name }}
        </h1>

        {% if attraction.image %}
        <img src="{{ attraction.image.url }}"
             class="rounded-xl w-full mb-8">
        {% endif %}

        <p class="text-lg">
            {{ attraction.description }}
        </p>

        <div class="mt-8">

            <strong>Location:</strong>
            {{ attraction.location }}

        </div>

        <div class="mt-2">

            <strong>Category:</strong>
            {{ attraction.category }}

        </div>

    </div>

</section>

{% endblock %}
