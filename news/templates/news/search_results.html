{% extends 'base.html' %}

{% block content %}

<section class="container mx-auto px-4 py-12">

    <h1 class="text-4xl font-bold mb-8">

        Search Results for:
        "{{ query }}"

    </h1>

    {% for post in results %}

    <div class="bg-white p-6 shadow rounded mb-4">

        <h2 class="text-2xl font-bold">

            <a href="{% url 'news_detail' post.slug %}">
                {{ post.title }}
            </a>

        </h2>

        <p>
            {{ post.summary }}
        </p>

    </div>

    {% empty %}

    <div class="bg-yellow-100 p-5 rounded">

        No results found.

    </div>

    {% endfor %}

</section>

{% endblock %}
